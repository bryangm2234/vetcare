spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: ms-agenda
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017}
    database: vetcare_agenda

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

vetcare:
  cors:
    origenes: ${VETCARE_CORS_ORIGENES:http://localhost:5173}
  jwt:
    public-key: ${JWT_PUBLIC_KEY:}
  servicios:
    pacientes-url: ${PACIENTES_URL:http://localhost:8081}
    timeout-segundos: 10
  clave-proceso: ${VETCARE_CLAVE_PROCESO:}
  correo:
    remitente: ${VETCARE_CORREO_REMITENTE:}
