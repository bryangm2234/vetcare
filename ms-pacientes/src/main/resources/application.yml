spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: ms-pacientes
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017}
    database: vetcare_pacientes

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

vetcare:
  cors:
    origenes: ${VETCARE_CORS_ORIGENES:http://localhost:5173}
  jwt:
    public-key: ${JWT_PUBLIC_KEY:}
    private-key: ${JWT_PRIVATE_KEY:}
    expiracion-minutos: 30
  admin:
    correo: ${VETCARE_ADMIN_CORREO:}
    contrasena: ${VETCARE_ADMIN_CONTRASENA:}
