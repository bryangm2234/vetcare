spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  config:
    import: optional:file:../.env[.properties]
  application:
    name: ms-historia-clinica
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017}
    database: vetcare_historia

server:
  port: ${PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

vetcare:
  cors:
    origenes: ${VETCARE_CORS_ORIGENES:http://localhost:5173}
  jwt:
    public-key: ${JWT_PUBLIC_KEY:}
  servicios:
    pacientes-url: ${PACIENTES_URL:http://localhost:8081}
    agenda-url: ${AGENDA_URL:http://localhost:8082}
    farmacia-url: ${FARMACIA_URL:http://localhost:8084}
    timeout-segundos: 10
