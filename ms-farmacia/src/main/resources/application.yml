spring:
  application:
    name: ms-farmacia
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017}
    database: vetcare_farmacia

server:
  port: ${PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
