name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?serverSelectionTimeoutMS=5000
    strategy:
      fail-fast: false
      matrix:
        servicio: [ms-pacientes, ms-agenda, ms-historia-clinica, ms-farmacia, ms-facturacion]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.servicio }}/pom.xml
      - name: Iniciar MongoDB
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:9.0.4
          for intento in $(seq 1 30); do
            if docker exec mongodb mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::MongoDB no arranco: $(docker logs --tail 15 mongodb 2>&1 | tr -s '[:space:]' ' ' | cut -c1-1500)"
          exit 1
      - name: Compilar y probar ${{ matrix.servicio }}
        working-directory: ${{ matrix.servicio }}
        run: sh mvnw -B verify
      - name: Construir la imagen Docker de ${{ matrix.servicio }}
        run: docker build -t vetcare-${{ matrix.servicio }} ${{ matrix.servicio }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar credenciales en el repositorio
        run: |
          if git grep -nE 'mongodb\+srv://[^/:@ ]+:[^@ ]+@|BEGIN (RSA |EC )?PRIVATE KEY|ghp_[A-Za-z0-9]{20}' -- . ':!.github'; then
            echo "::error::Se encontraron posibles credenciales en el repositorio"
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.local\.md$'; then
            echo "::error::Hay archivos de credenciales versionados"
            exit 1
          fi
