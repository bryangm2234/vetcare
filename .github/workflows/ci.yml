name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
    env:
      MONGODB_TEST_URI: mongodb://localhost:27017
    strategy:
      fail-fast: false
      matrix:
        servicio: [ms-pacientes, ms-agenda, ms-historia-clinica, ms-farmacia, ms-facturacion]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.servicio }}/pom.xml
      - name: Compilar y probar ${{ matrix.servicio }}
        working-directory: ${{ matrix.servicio }}
        run: sh mvnw -B verify
