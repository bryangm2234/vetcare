spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: ms-facturacion
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017}
    database: vetcare_facturacion

server:
  port: ${PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

vetcare:
  cors:
    origenes: ${VETCARE_CORS_ORIGENES:http://localhost:5173}
  jwt:
    public-key: ${JWT_PUBLIC_KEY:}
  servicios:
    pacientes-url: ${PACIENTES_URL:http://localhost:8081}
    agenda-url: ${AGENDA_URL:http://localhost:8082}
    historia-url: ${HISTORIA_URL:http://localhost:8083}
    farmacia-url: ${FARMACIA_URL:http://localhost:8084}
    timeout-segundos: 10
  facturacion:
    tasa-impuesto: ${VETCARE_TASA_IMPUESTO:19}
  correo:
    remitente: ${VETCARE_CORREO_REMITENTE:}
